<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoyTeReacciono - Directo</title>
<style>
:root{--bg:#0e0d12;--panel:#17151e;--panel2:#1f1c29;--line:#2c2839;--text:#f1eef8;--mute:#9a94ad;--accent:#9146ff;--accent2:#b58bff;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800}
.live{margin-left:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.live.on{color:var(--ok);border-color:var(--ok)}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:600;transition:background .15s,border-color .15s}
nav a:hover{border-color:var(--accent);background:#2a2540}
nav a.patreon:hover{border-color:#ff424d}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;padding:12px;min-height:0}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.player{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:100%;max-height:calc(100vh - 170px);border:1px solid var(--line)}
.player #tw,.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:17px;flex:1;min-width:160px}
.bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:#7d33f0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.seg button{background:none;border:0;padding:8px 13px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:not([aria-pressed=true]):hover{color:var(--text)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.profile{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);background:var(--panel2);flex:none}
.pinfo{flex:1;min-width:160px}
.pinfo h1{font-size:22px;line-height:1.2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.subbtn{font-size:14px;font-weight:700;padding:6px 16px;border-radius:8px;background:#9146ff;color:#fff;transition:background .15s}
.subbtn:hover{background:#7d33f0}
.pinfo p{font-size:14px;color:var(--mute)}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.soc{padding:8px 18px;border-radius:8px;font-weight:700;font-size:14px;border:0;transition:transform .12s,filter .12s}
.soc:hover{filter:brightness(1.12);transform:translateY(-1px)}
.soc.twitch{background:#9146ff;color:#fff}
.soc.kick{background:#53fc18;color:#0b0e0a}
.soc.tiktok{background:#fe2c55;color:#fff}
.soc.patreon{background:#ff424d;color:#fff;background:linear-gradient(135deg,#f96854,#ff424d)}
.soc.discord{background:#5865f2;color:#fff}
.qnote{font-size:12px;color:var(--mute)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;align-self:start;position:sticky;top:12px}
aside{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:360px;height:calc(100vh - 336px)}
main.nochat aside{display:none}
.chead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.chead strong{flex:1;font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok)}.dot.load{background:#ffc857;animation:p 1s infinite}.dot.err{background:var(--bad)}
@keyframes p{50%{opacity:.3}}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center}
.ib:hover{background:var(--panel);border-color:var(--line)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:r .7s linear}
@keyframes r{to{transform:rotate(360deg)}}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;padding:9px 6px;background:none;border:0;border-bottom:3px solid transparent;font-weight:700;font-size:14px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button[aria-selected=true]{color:var(--text)}
.tabs button[data-p=twitch][aria-selected=true]{border-color:#9146ff}
.tabs button[data-p=kick][aria-selected=true]{border-color:#53fc18}
.tabs .dot{width:7px;height:7px}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
.cbody{position:relative;flex:1;min-height:0}
.cbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#18181b}
.cover{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--mute);z-index:2}
.cover[hidden]{display:none}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}
.cfoot{padding:8px 10px;border-top:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cfoot button{background:none;border:0;color:var(--accent2);font-size:12px;font-weight:600;text-decoration:underline;padding:0}
.cfoot button.kbtn{background:#53fc18;color:#0b0e0a;text-decoration:none;font-size:13px;font-weight:700;padding:6px 14px;border-radius:8px}
.cfoot button.kbtn:hover{filter:brightness(1.1)}
.cfoot button.pbtn{background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:6px 14px;border-radius:8px}
.cfoot button.pbtn:hover{background:#7d33f0}
.cfoot button[hidden],.cfoot[hidden]{display:none}
.kwrite{position:absolute;left:0;right:0;bottom:0;height:128px;z-index:3;background:var(--panel2);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 14px;text-align:center;font-size:13px;line-height:1.4;color:var(--mute)}
.kwrite b{color:var(--text)}
.kwrite>div{width:100%}
.kwrite #kOut{display:flex;flex-direction:column;align-items:center;gap:8px}
.kwrite [hidden]{display:none!important}
.kwrite .kbtn{background:#53fc18;color:#0b0e0a;border:0;font-size:14px;font-weight:700;padding:9px 18px;border-radius:8px}
.kwrite .kbtn:hover{filter:brightness(1.1)}
.chatToggle{position:absolute;top:10px;right:10px;z-index:5;width:34px;height:34px;border-radius:8px;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;opacity:.75;transition:opacity .15s,background .15s}
.chatToggle:hover{opacity:1;background:rgba(0,0,0,.7)}
.chatToggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chatToggle .a-show{display:none}
main.nochat .chatToggle .a-hide{display:none}
main.nochat .chatToggle .a-show{display:block}
.twitchbox{position:relative;width:100%;height:300px;flex:none;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.twitchbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ib[hidden],.btn[hidden]{display:none}
#btnMode{padding:4px 10px;font-size:12px}
#twPick{position:absolute;left:8px;right:8px;bottom:58px;height:280px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#twPickQ{margin:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;font:inherit}
#twPickGrid{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
#twPickGrid button{background:none;border:0;border-radius:6px;padding:3px;display:grid;place-items:center;min-width:38px;height:38px}
#twPickGrid button:hover{background:rgba(255,255,255,.1)}
#twPickGrid img{height:30px;width:auto;max-width:90px}
.tw{position:absolute;inset:0;display:flex;flex-direction:column;background:#18181b}
.tw [hidden],.tw[hidden]{display:none!important}
#twLog{flex:1;overflow-y:auto;padding:8px 10px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
#twLog p{margin:0 0 4px}
#twLog p{padding:3px 6px;border-radius:6px}
#twLog p:hover{background:rgba(255,255,255,.05)}
#twLog img{vertical-align:middle}
#twLog img.bd{height:18px;width:18px;margin:-2px 3px 0 0;border-radius:3px;display:inline-block}
#twLog img.em{height:28px;width:auto;margin:-6px 2px}
#twLog a{color:var(--accent2);text-decoration:underline}
#twLog p b{font-weight:700}
.twbar{border-top:1px solid var(--line);background:var(--panel2);padding:8px;display:flex;gap:8px;align-items:center}
.twbar span{flex:1;font-size:13px;color:var(--mute)}
.twbar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit}
footer{padding:12px 20px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;text-align:center}
@media(min-width:961px){
.twitchbox{height:clamp(160px,26vh,300px)}
aside{height:calc(100vh - 36px - clamp(160px,26vh,300px))}
}
@media(max-width:960px){
main{grid-template-columns:1fr}
.side{position:static}
aside{height:560px;min-height:0}
.player{max-height:none}
nav{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
/* ===== CONFIGURACIÓN ===== */
const CHANNEL = "hoytereacciono";      // Twitch
const KICK_CHANNEL = "hoytereacciono1"; // Kick
const TWITCH_CLIENT_ID = "xihf7hesdzufnny24y8k2uflz0t2ht";   // <-- pega aquí el Client ID de tu app en dev.twitch.tv/console (ver instrucciones)
const REDIRECT_URI = "https://hoytereacciono-o6ci.vercel.app/"; // debe ser idéntica a la "OAuth Redirect URL" de la app
const CUSTOM_OK = !!TWITCH_CLIENT_ID;
/* Modo oficial (por defecto): chat de Twitch embebido = emotes, puntos de canal, bits, etc. igual que en twitch.tv.
   Modo compatible: chat propio con inicio de sesión (sirve si el navegador bloquea cookies de terceros). */
let CUSTOM = false;
try { CUSTOM = CUSTOM_OK && localStorage.getItem("twmode") === "custom"; } catch(e){}
const FOLLOWERS = "Directos en Twitch y Kick";   // texto bajo el nombre (ej. "1.2K seguidores")
const AVATAR_URL = "";               // opcional: otra foto (por defecto usa la de Twitch)
const LINKS = {
  tiktok:  "https://www.tiktok.com/@hoytereacciono_oficial",
  patreon: "https://www.patreon.com/cw/hoytereaccionoEsp/home",
  discord: "https://discord.com/invite/EcDz5z68H9"
};
const STREAM_URL = "https://meshcast.io/view.html?geo=cn1&id=FernandoRoronoa"; // reproductor de Meshcast (servidor intermedio de VDO.Ninja).
/* ========================= */

const $ = id => document.getElementById(id);
const PARENT = location.hostname || "localhost";

$("followers").textContent = FOLLOWERS;
$("followers").hidden = !FOLLOWERS;
$("lnkSub").href = "https://www.twitch.tv/" + CHANNEL;
if (AVATAR_URL) $("avatar").src = AVATAR_URL;
$("lnkTwitch").href = "https://www.twitch.tv/" + CHANNEL;
$("lnkKick").href = "https://kick.com/" + KICK_CHANNEL;
$("lnkTiktok").href = LINKS.tiktok;
$("lnkPatreon").href = LINKS.patreon;
$("lnkDiscord").href = LINKS.discord;

/* ---------- Reproductor (Meshcast) ---------- */
function loadStream(){
  const f = $("okplayer");
  f.src = "about:blank";
  setTimeout(() => { f.src = STREAM_URL; }, 100);
}
loadStream();
$("btnReload").addEventListener("click", loadStream);
(function(){ const t = $("liveTag"); t.textContent = "Baja latencia"; t.classList.remove("on"); })();

/* ---------- Reproductor de Twitch (visible, suma espectadores) ---------- */
$("twPlayer").src = "https://player.twitch.tv/?channel=" + encodeURIComponent(CHANNEL) + "&parent=" + encodeURIComponent(PARENT) + "&autoplay=true&muted=true";

/* ---------- Chat (Twitch + Kick) ---------- */
const PLATFORMS = {
  twitch:{ url:"https://www.twitch.tv/embed/"+CHANNEL+"/chat?parent="+encodeURIComponent(PARENT)+"&darkpopout",
           pop:"https://www.twitch.tv/popout/"+CHANNEL+"/chat?popout=", login:"https://www.twitch.tv/login", name:"Twitch" },
  kick:  { url:"https://kick.com/popout/"+KICK_CHANNEL+"/chat",
           pop:"https://kick.com/popout/"+KICK_CHANNEL+"/chat", name:"Kick" }
};
let active = "twitch", hiddenAt = 0;

Object.keys(PLATFORMS).forEach(k => {
  const p = PLATFORMS[k];
  p.pane = document.querySelector('.pane[data-p="'+k+'"]');
  p.frame = p.pane.querySelector("iframe");
  p.cover = p.pane.querySelector(".cover");
  p.tab = document.querySelector('.tabs button[data-p="'+k+'"]');
  p.dot = p.tab.querySelector(".dot");
  p.tries = 0; p.loaded = false; p.timer = null; p.started = false;
  p.frame.addEventListener("load", () => {
    if (p.frame.getAttribute("src") === "about:blank" || !p.frame.getAttribute("src")) return;
    p.loaded = true; p.tries = 0; clearTimeout(p.timer);
    p.cover.hidden = true; setDot(p, "ok"); updateHead();
  });
  p.pane.querySelector(".cretry").addEventListener("click", () => loadChat(k, true));
});

function setDot(p, kind){ p.dot.className = "dot " + kind; }
function cover(p, msg, failed){
  p.cover.hidden = false;
  p.cover.querySelector(".cmsg").textContent = msg;
  p.cover.querySelector(".spinner").style.display = failed ? "none" : "";
  p.cover.querySelector(".cretry").hidden = !failed;
}
function updateHead(){
  const p = PLATFORMS[active];
  $("cState").textContent = p.loaded ? "Chat de " + p.name + " conectado" : "Chat de " + p.name;
}

function loadChat(k, manual){
  const p = PLATFORMS[k];
  if (k === "twitch" && CUSTOM) { if (manual) TW.retry = 0; return connectTw(); }
  p.started = true;
  if (manual) p.tries = 0;
  clearTimeout(p.timer);
  p.loaded = false;
  setDot(p, "load");
  cover(p, p.tries ? "Reintentando conexión ("+p.tries+"/3)…" : "Conectando con el chat de "+p.name+"…", false);
  p.frame.src = "about:blank";
  setTimeout(() => { p.frame.src = p.url; }, 80);
  p.timer = setTimeout(() => {
    if (p.loaded) return;
    if (p.tries < 3) { p.tries++; loadChat(k, false); }
    else { setDot(p, "err"); cover(p, "No se pudo cargar el chat de "+p.name+". Revisa tu conexión e inténtalo de nuevo.", true); }
  }, 9000 + p.tries * 3000);
  updateHead();
}

function showTab(k){
  active = k;
  Object.keys(PLATFORMS).forEach(n => {
    const p = PLATFORMS[n], on = n === k;
    p.pane.classList.toggle("on", on);
    p.tab.setAttribute("aria-selected", on);
  });
  if (!PLATFORMS[k].started) loadChat(k, true);
  updateHead(); updateFoot();
  if (CUSTOM && k === "twitch") $("twLog").scrollTop = $("twLog").scrollHeight;
}
function updateFoot(){ $("btnPop").hidden = false; }
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.p)));

$("btnRefresh").addEventListener("click", () => {
  const b = $("btnRefresh");
  b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
  loadChat(active, true);
});

/* Escribir en Kick: el navegador bloquea la sesión de Kick dentro de un iframe,
   así que se escribe desde la ventana del chat de Kick (ahí la sesión sí se guarda). */
function openWin(url, name, w, h){
  const x = Math.max(0, (screen.width - w) / 2), y = Math.max(0, (screen.height - h) / 2);
  const win = window.open(url, name, "width="+w+",height="+h+",left="+x+",top="+y);
  if (!win) { window.open(url, "_blank", "noopener"); return null; }
  win.focus(); return win;
}
function writeKick(){ openWin(PLATFORMS.kick.pop, "kick_chat", 440, 720); }
/* ---------- Chat de Twitch propio: inicio de sesión sin ventanas extra ----------
   "Iniciar sesión con Twitch" va a Twitch en la misma pestaña y Twitch devuelve al usuario
   a REDIRECT_URI (esta página) ya con sesión. No usa el iframe de Twitch, así que funciona
   aunque el navegador bloquee cookies de terceros (Safari, iPhone, Brave, incógnito). */
const TW = { ws:null, token:null, login:null, retry:0, timer:null, seen:false };
const getS = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const setS = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} };
if (CUSTOM) { PLATFORMS.twitch.frame.hidden = true; $("twChat").hidden = false; }

async function initTw(){
  if (!CUSTOM) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token")) {                      // el usuario vuelve de Twitch
    const ok = h.get("state") && h.get("state") === getS("tw_state");
    history.replaceState(null, "", location.pathname + location.search);
    setS("tw_state", null);
    if (ok) setS("tw_token", h.get("access_token"));
  }
  const t = getS("tw_token");
  if (t) {
    try {
      const r = await fetch("https://id.twitch.tv/oauth2/validate", { headers:{ Authorization:"OAuth " + t } });
      if (r.status === 401) setS("tw_token", null);
      else if (r.ok) { const d = await r.json(); TW.token = t; TW.login = d.login; }
    } catch(e){}
  }
  twUI();
}
function twUI(){
  const on = !!TW.token;
  $("twOut").hidden = on; $("twForm").hidden = !on; $("twPick").hidden = true;
  $("twInput").placeholder = on ? "Enviar mensaje como " + TW.login : "";
}
$("twLogin").addEventListener("click", () => {
  const st = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2);
  setS("tw_state", st);
  location.href = "https://id.twitch.tv/oauth2/authorize?" + new URLSearchParams({
    client_id: TWITCH_CLIENT_ID, redirect_uri: REDIRECT_URI, response_type: "token",
    scope: "chat:read chat:edit", state: st });
});
$("twLogout").addEventListener("click", () => {
  const t = TW.token;
  setS("tw_token", null); TW.token = TW.login = null; twUI(); connectTw();
  if (t) fetch("https://id.twitch.tv/oauth2/revoke", { method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body:new URLSearchParams({ client_id:TWITCH_CLIENT_ID, token:t }) }).catch(() => {});
});
$("twForm").addEventListener("submit", e => {
  e.preventDefault();
  const i = $("twInput"), t = i.value.trim();
  if (!t || !TW.ws || TW.ws.readyState !== 1) return;
  TW.ws.send("PRIVMSG #" + CHANNEL + " :" + t);
  twMsg((TW.me && TW.me["display-name"]) || TW.login, TW.me && TW.me.color, t, "", TW.me && TW.me.badges); // Twitch no devuelve tus propios mensajes
  i.value = "";
});

function connectTw(){
  const p = PLATFORMS.twitch;
  p.started = true; clearTimeout(TW.timer);
  if (TW.ws) { TW.ws.onclose = null; try { TW.ws.close(); } catch(e){} }
  p.loaded = false; setDot(p, "load"); updateHead();
  if (!TW.seen) cover(p, "Conectando con el chat de Twitch…", false);
  const ws = TW.ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    ws.send("PASS " + (TW.token ? "oauth:" + TW.token : "SCHMOOPIIE"));
    ws.send("NICK " + (TW.token ? TW.login : "justinfan" + (10000 + Math.floor(Math.random() * 80000))));
    ws.send("JOIN #" + CHANNEL);
  };
  ws.onmessage = e => String(e.data).split("\r\n").forEach(l => l && twLine(l));
  ws.onclose = () => {
    if (ws !== TW.ws) return;
    p.loaded = false; updateHead();
    if (TW.retry < 3) { setDot(p, "load"); TW.timer = setTimeout(connectTw, 1500 * ++TW.retry); }
    else { setDot(p, "err"); cover(p, "No se pudo conectar con el chat de Twitch. Revisa tu conexión e inténtalo de nuevo.", true); }
  };
}
function twLine(l){
  if (l.startsWith("PING")) { TW.ws.send("PONG :tmi.twitch.tv"); return; }
  const tags = {};
  if (l[0] === "@") {
    const i = l.indexOf(" ");
    l.slice(1, i).split(";").forEach(t => { const j = t.indexOf("="); tags[t.slice(0, j)] = t.slice(j + 1); });
    l = l.slice(i + 1);
  }
  const m = l.match(/^:(\S+) (\S+) ?(.*)$/);
  if (!m) return;
  const cmd = m[2], rest = m[3], p = PLATFORMS.twitch;
  if (cmd === "001") { p.loaded = true; TW.seen = true; TW.retry = 0; p.cover.hidden = true; setDot(p, "ok"); updateHead(); }
  else if (cmd === "NOTICE" && /authentication failed/i.test(rest)) { setS("tw_token", null); TW.token = TW.login = null; twUI(); connectTw(); }
  else if (cmd === "NOTICE") twSys(rest.replace(/^\S+ :/, ""));
  else if (cmd === "RECONNECT") TW.ws.close();
  else if (cmd === "ROOMSTATE") { if (tags["room-id"] && TW.roomId !== tags["room-id"]) { TW.roomId = tags["room-id"]; loadExtras(TW.roomId); } }
  else if (cmd === "USERSTATE" || cmd === "GLOBALUSERSTATE") {
    if (cmd === "USERSTATE") TW.me = tags;
    if (tags["emote-sets"]) loadSets(tags["emote-sets"].split(","));
  }
  else if (cmd === "PRIVMSG") {
    if (!TW.roomId && tags["room-id"]) { TW.roomId = tags["room-id"]; loadExtras(TW.roomId); }
    twMsg(tags["display-name"] || m[1].split("!")[0], tags.color, rest.slice(rest.indexOf(" :") + 2), tags.emotes, tags.badges);
  }
}
function twPush(el){
  const log = $("twLog"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.append(el);
  while (log.childElementCount > 200) log.firstElementChild.remove();
  if (atEnd) log.scrollTop = log.scrollHeight;
}
function twSys(text){
  const p = document.createElement("p"); p.style.cssText = "color:var(--mute);font-style:italic"; p.textContent = text; twPush(p);
}
/* ---------- Insignias (mod, VIP, sub...) y emotes extra (7TV, BTTV, FFZ, emotes de Twitch por nombre) ---------- */
TW.badges = {}; TW.emo = {}; TW.nat = {}; TW.roomId = null; TW.me = null; TW.setsDone = {};
const _bd = (bg, glyph) => "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="' + bg + '"/>' + glyph + '</svg>');
const BADGE_FALLBACK = {
  broadcaster: _bd("#e91916", '<path d="M3 6h8v6H3zM12 8l4-2v6l-4-2z" fill="#fff"/>'),
  moderator:   _bd("#00ad03", '<path d="M4 13l7-7 1.5 1.5-7 7zM11 4.5l3-.5-.5 3z" fill="#fff"/>'),
  vip:         _bd("#e005b9", '<path d="M9 3l6 6-6 6-6-6z" fill="#fff"/>'),
  subscriber:  _bd("#8205b4", '<path d="M9 3l1.8 3.7 4.1.6-3 2.9.7 4.1L9 12.3l-3.6 2 .7-4.1-3-2.9 4.1-.6z" fill="#fff"/>'),
  founder:     _bd("#8205b4", '<path d="M9 3l1.8 3.7 4.1.6-3 2.9.7 4.1L9 12.3l-3.6 2 .7-4.1-3-2.9 4.1-.6z" fill="#fff"/>'),
  staff:       _bd("#6441a5", '<path d="M5 5h8v8H5z" fill="#fff"/>'),
  partner:     _bd("#9146ff", '<path d="M5 9l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/>'),
  premium:     _bd("#00a7f5", '<path d="M3 13V6l3 3 3-4 3 4 3-3v7z" fill="#fff"/>')
};
const BADGE_NAME = { broadcaster:"Streamer", moderator:"Moderador", vip:"VIP", subscriber:"Suscriptor", founder:"Fundador", staff:"Staff", partner:"Verificado", premium:"Prime Gaming" };

async function getJ(url, headers){
  try { const r = await fetch(url, headers ? { headers } : undefined); return r.ok ? await r.json() : null; } catch(e){ return null; }
}
function addBadgeSets(list){
  (list || []).forEach(b => {
    const id = b.set_id || b.setID;
    (b.versions || []).forEach(v => { const u = v.image_url_2x || v.image_url_1x; if (id && u) TW.badges[id + "/" + v.id] = u; });
  });
}
async function loadBadges(roomId){
  if (TW.token) {
    const H = { Authorization: "Bearer " + TW.token, "Client-Id": TWITCH_CLIENT_ID };
    const g = await getJ("https://api.twitch.tv/helix/chat/badges/global", H);
    if (g) addBadgeSets(g.data);
    const c = await getJ("https://api.twitch.tv/helix/chat/badges?broadcaster_id=" + roomId, H);
    if (c) addBadgeSets(c.data);
    if (g || c) return;
  }
  addBadgeSets(await getJ("https://api.ivr.fi/v2/twitch/badges/global"));
  addBadgeSets(await getJ("https://api.ivr.fi/v2/twitch/badges/channel?login=" + CHANNEL));
}
function addEmo(name, url){ if (name && url) TW.emo[name] = url; }
async function loadExtras(roomId){
  loadBadges(roomId);
  // 7TV
  const lst = d => ((d && (d.emotes || (d.emote_set && d.emote_set.emotes))) || []);
  const seven = e => { const h = e.data && e.data.host; if (h) addEmo(e.name, "https:" + h.url + "/2x.webp"); };
  lst(await getJ("https://7tv.io/v3/emote-sets/global")).forEach(seven);
  lst(await getJ("https://7tv.io/v3/users/twitch/" + roomId)).forEach(seven);
  // BetterTTV
  const bt = e => addEmo(e.code, "https://cdn.betterttv.net/emote/" + e.id + "/2x.webp");
  (await getJ("https://api.betterttv.net/3/cached/emotes/global") || []).forEach(bt);
  const bc = await getJ("https://api.betterttv.net/3/cached/users/twitch/" + roomId);
  if (bc) [].concat(bc.channelEmotes || [], bc.sharedEmotes || []).forEach(bt);
  // FrankerFaceZ
  const ff = d => { if (d && d.sets) Object.values(d.sets).forEach(st => (st.emoticons || []).forEach(e => { const u = e.urls && (e.urls["2"] || e.urls["1"]); if (u) addEmo(e.name, "https:" + u.replace(/^https?:/, "")); })); };
  ff(await getJ("https://api.frankerfacez.com/v1/set/global"));
  ff(await getJ("https://api.frankerfacez.com/v1/room/id/" + roomId));
}
async function loadSets(ids){          // emotes de Twitch (globales + tus subs) para reconocerlos por nombre en tus mensajes
  if (!TW.token) return;
  ids = ids.filter(x => x && !TW.setsDone[x]); ids.forEach(x => TW.setsDone[x] = 1);
  const H = { Authorization: "Bearer " + TW.token, "Client-Id": TWITCH_CLIENT_ID };
  for (let i = 0; i < ids.length; i += 25) {
    const q = ids.slice(i, i + 25).map(x => "emote_set_id=" + encodeURIComponent(x)).join("&");
    const d = await getJ("https://api.twitch.tv/helix/chat/emotes/set?" + q, H);
    if (d && d.data) d.data.forEach(e => { TW.nat[e.name] = 1; addEmo(e.name, "https://static-cdn.jtvnw.net/emoticons/v2/" + encodeURIComponent(e.id) + "/default/dark/2.0"); });
  }
}
function mkEmote(src, alt){
  const img = new Image(); img.className = "em"; img.alt = alt; img.title = alt; img.loading = "lazy"; img.src = src; return img;
}
function addText(p, str){              // texto con enlaces y emotes de terceros
  let buf = "";
  const flush = () => { if (buf) { p.append(buf); buf = ""; } };
  str.split(/(\s+)/).forEach(tok => {
    if (/^https?:\/\/\S+$/i.test(tok)) { flush(); const a = document.createElement("a"); a.href = tok; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = tok; p.append(a); }
    else if (Object.prototype.hasOwnProperty.call(TW.emo, tok)) { flush(); p.append(mkEmote(TW.emo[tok], tok)); }
    else buf += tok;
  });
  flush();
}
function twMsg(name, color, text, emotes, badges){
  const act = text.startsWith("\x01ACTION "), chars = Array.from(text), end = act ? chars.length - 1 : chars.length;
  const ranges = [];
  (emotes || "").split("/").forEach(e => {
    if (!e) return;
    const [id, pos] = e.split(":");
    pos.split(",").forEach(r => { const [a, b] = r.split("-").map(Number); ranges.push({ a, b, id }); });
  });
  ranges.sort((x, y) => x.a - y.a);
  const p = document.createElement("p"), n = document.createElement("b");
  (badges || "").split(",").forEach(b => {                       // insignias
    if (!b) return;
    const set = b.split("/")[0], url = TW.badges[b] || BADGE_FALLBACK[set];
    if (!url) return;
    const img = new Image(); img.className = "bd"; img.src = url; img.alt = set;
    img.title = BADGE_NAME[set] || set;
    img.onerror = () => { if (BADGE_FALLBACK[set] && img.src !== BADGE_FALLBACK[set]) img.src = BADGE_FALLBACK[set]; else img.remove(); };
    p.append(img);
  });
  n.textContent = name; n.style.color = /^#[0-9a-f]{6}$/i.test(color || "") ? color : "var(--accent2)";
  p.append(n, ": ");
  if (act) p.style.fontStyle = "italic";
  let i = act ? 8 : 0;
  ranges.forEach(r => {
    if (r.b >= end || r.a < i) return;
    if (r.a > i) addText(p, chars.slice(i, r.a).join(""));
    p.append(mkEmote("https://static-cdn.jtvnw.net/emoticons/v2/" + encodeURIComponent(r.id) + "/default/dark/2.0", chars.slice(r.a, r.b + 1).join("")));
    i = r.b + 1;
  });
  if (i < end) addText(p, chars.slice(i, end).join(""));
  twPush(p);
}

/* ---------- Selector de emotes (modo compatible): tus emotes de Twitch primero, luego 7TV / BTTV / FFZ ---------- */
function pickFill(){
  const q = $("twPickQ").value.trim().toLowerCase(), g = $("twPickGrid"); g.textContent = "";
  Object.keys(TW.emo).filter(n => !q || n.toLowerCase().includes(q))
    .sort((a, b) => (TW.nat[b] || 0) - (TW.nat[a] || 0)).slice(0, 200).forEach(n => {
      const b = document.createElement("button"); b.type = "button"; b.title = n; b.append(mkEmote(TW.emo[n], n));
      b.onclick = () => { const i = $("twInput"); i.value += (i.value && !/\s$/.test(i.value) ? " " : "") + n + " "; i.focus(); };
      g.append(b);
    });
}
$("twEmo").addEventListener("click", () => { const p = $("twPick"); p.hidden = !p.hidden; if (!p.hidden) { pickFill(); $("twPickQ").focus(); } });
$("twPickQ").addEventListener("input", pickFill);
if (CUSTOM_OK) {
  const b = $("btnMode"); b.hidden = false;
  b.textContent = CUSTOM ? "Chat oficial" : "Modo compatible";
  b.title = CUSTOM ? "Chat oficial de Twitch: emotes y puntos de canal" : "Chat propio: úsalo si no puedes iniciar sesión en el chat oficial";
  b.addEventListener("click", () => { try { localStorage.setItem("twmode", CUSTOM ? "official" : "custom"); } catch(e){} location.reload(); });
}

/* ---------- Escribir en Kick: abre la ventana del chat de Kick ---------- */
$("kOutText").textContent = "Para escribir en Kick inicia sesión en su ventana de chat. Aquí abajo solo se puede leer.";
$("btnWrite2").addEventListener("click", writeKick);

$("btnPop").addEventListener("click", () => {
  if (active === "kick") writeKick();
  else openWin(PLATFORMS.twitch.pop + "&darkpopout", "twitch_chat", 440, 720);
});

/* Mostrar / ocultar chat */
function setChat(show){
  $("main").classList.toggle("nochat", !show);
  try { localStorage.setItem("chat", show ? "1" : "0"); } catch(e){}
  if (show && !PLATFORMS[active].loaded) loadChat(active, true);
}
$("btnHide").addEventListener("click", () => setChat(false));
$("chatToggle").addEventListener("click", () => setChat($("main").classList.contains("nochat")));
function syncToggle(){
  const hidden = $("main").classList.contains("nochat"), b = $("chatToggle");
  b.title = b.ariaLabel = hidden ? "Mostrar chat" : "Ocultar chat";
  b.setAttribute("aria-expanded", !hidden);
}
new MutationObserver(syncToggle).observe($("main"), { attributes:true, attributeFilter:["class"] });

/* Recuperación automática */
window.addEventListener("online", () => { loadStream(); Object.keys(PLATFORMS).forEach(k => PLATFORMS[k].started && loadChat(k, true)); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt) {
    const away = Date.now() - hiddenAt;
    if (away > 60*1000) loadStream();   // la conexión de video suele caerse si la pestaña estuvo en segundo plano
    if (away > 5*60*1000 && !$("main").classList.contains("nochat")) loadChat(active, true);
  }
});

let startHidden = false;
try { startHidden = localStorage.getItem("chat") === "0"; } catch(e){}
if (startHidden) $("main").classList.add("nochat");
else loadChat("kick", true);
initTw().then(() => { if (!startHidden) loadChat("twitch", true); });
updateFoot(); syncToggle();
</script>
